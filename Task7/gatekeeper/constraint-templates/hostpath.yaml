apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsphostfilesystem
spec:
  crd:
    spec:
      names:
        kind: K8sPSPHostFilesystem
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedHostPaths:
              type: array
              items:
                type: object
                properties:
                  pathPrefix:
                    type: string
                  readOnly:
                    type: boolean
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsphostfilesystem
        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          has_hostpath(volume)
          not input_hostpath_allowed(volume.hostPath)
          msg := sprintf("hostPath volume '%v' is forbidden by the security policy", [volume.name])
        }
        has_hostpath(v) { v.hostPath }
        input_hostpath_allowed(hostPath) {
          allowed := object.get(input, "parameters", {}).allowedHostPaths
          some i
          allowed[i].pathPrefix == hostPath.path
        }